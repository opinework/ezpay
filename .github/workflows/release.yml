name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      packages:
        description: Package format to build
        type: choice
        required: true
        default: all
        options:
          - all
          - archlinux
          - debian
          - tarball

permissions:
  contents: write

jobs:
  release:
    name: Build Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Get version
        id: version
        run: echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd dpkg-dev fakeroot zip

      - name: Test
        run: go test ./...

      - name: Build packages
        env:
          PACKAGE_FORMAT: ${{ inputs.packages || 'all' }}
        run: |
          case "$PACKAGE_FORMAT" in
            all) bash build-all.sh --all ;;
            archlinux) bash build-all.sh --archlinux ;;
            debian) bash build-all.sh --debian ;;
            tarball) bash build-all.sh --tarball ;;
            *) echo "Unknown package format: $PACKAGE_FORMAT" >&2; exit 1 ;;
          esac

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts

          # Copy all packages (exclude intermediate checksums)
          find release -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.pkg.tar.zst" \) -exec cp {} release-artifacts/ \;

          # Generate combined checksums
          cd release-artifacts
          compgen -G '*' > /dev/null || { echo "No release packages found" >&2; exit 1; }
          sha256sum -- * > CHECKSUMS.txt

          echo "Release artifacts:"
          ls -lh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ezpay-${{ inputs.packages || 'all' }}-${{ github.run_number }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## EzPay ${{ steps.version.outputs.VERSION }}

            ### Package Formats

            **Tarball (Universal):**
            - Linux (amd64, arm64)
            - macOS (amd64 Intel, arm64 Apple Silicon)
            - Windows (amd64)

            **Arch Linux:**
            - x86_64, aarch64

            **Debian/Ubuntu:**
            - amd64, arm64

            ### Installation

            **Tarball:**
            ```bash
            tar -xzf ezpay-*-linux-amd64.tar.gz
            cd ezpay-*-linux-amd64
            ./ezpay
            ```

            **Arch Linux:**
            ```bash
            sudo pacman -U ezpay-*.pkg.tar.zst
            ```

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i ezpay_*_amd64.deb
            sudo apt-get install -f
            ```
          files: release-artifacts/*
